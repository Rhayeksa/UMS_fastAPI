{% extends "base.html" %} 

{% block apps %} 
{% include "components/v1/navbar.html"%}
<div class="container pt-4">
    <form id="dashboard_filter" class="row g-3">
        <div class="col-md-6">
            <label for="date_from" class="form-label">From Date</label>
            <input
                type="date"
                class="form-control"
                id="date_from"
                name="date_from"
            />
        </div>
        <div class="col-md-6">
            <label for="date_to" class="form-label">To Date</label>
            <input
                type="date"
                class="form-control"
                id="date_to"
                name="date_to"
            />
        </div>
        <div class="col-md-4">
            <label for="Role" class="form-label">Role</label>
            <select id="Role" class="form-select" aria-label="Role select">
                <option selected>All</option>
                <option value="2">Administrator</option>
                <option value="3">User</option>
            </select>
        </div>
        <div class="col-md-4">
            <label for="gender" class="form-label">Gender</label>
            <select id="gender" class="form-select" aria-label="Gender select">
                <option selected>All</option>
                <option value="1">None</option>
                <option value="2">Male</option>
                <option value="3">Female</option>
            </select>
        </div>
        <div class="col-md-4 col-lg-3">
            <label for="age" class="form-label">Age</label>
            <select id="age" class="form-select" aria-label="Age select">
                <option selected>All</option>
                <option value="2">< 18</option>
                <option value="3">>= 18</option>
            </select>
        </div>
        <button class="col mx-2 btn btn-primary">Set</button>
    </form>
    <div class="row g-3 mt-5">
        <div class="col-md-6 border">
            <div class="">Chart.js Doughnut Chart => Gender: Male, Female, None</div>
        </div>
        <div class="col-md-6 border">
            <div class="">Chart.js Bar Chart => Age: <18 and >=18</div>
        </div>
    </div>
</div>
{% endblock %} 

{% block js %}
{% endblock %}
